# Serves the documentation and the playground at http://localhost:8008/. On Windows there is no need
# for this: build the project and run build/mialudoc.exe, see docs/playground.md.
services:
  playground:
    build: .
    ports:
      # Only this computer can reach the playground.
      - "127.0.0.1:8008:8008"
    restart: unless-stopped
