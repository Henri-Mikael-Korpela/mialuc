# Pushing a tag such as `v0.1.0` checks the tagged commit and, only if every check passes,
# publishes a GitHub release with the compiler for Windows on x64. The version in src/version.h
# is the single source of truth, and the tag has to match it.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag has the form vMAJOR.MINOR.PATCH
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Tag '$GITHUB_REF_NAME' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag '$GITHUB_REF_NAME' is not reachable from main"
            exit 1
          }

      - name: Tag matches src/version.h
        run: |
          get() { sed -n "s/^#define MIALU_VERSION_$1 \([0-9][0-9]*\)\s*$/\1/p" src/version.h | tr -d '\r'; }
          version="$(get MAJOR).$(get MINOR).$(get PATCH)"
          echo "version.h says $version"
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "::error::Tag '$GITHUB_REF_NAME' does not match version.h ($version)"
            exit 1
          }

      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Compiler reports the tagged version
        run: |
          out="$(./build/mialuc.exe --version | tr -d '\r')"
          echo "$out"
          [ "$out" = "mialuc ${GITHUB_REF_NAME#v}" ] || {
            echo "::error::'mialuc --version' printed '$out', expected 'mialuc ${GITHUB_REF_NAME#v}'"
            exit 1
          }

      - name: Examples are accepted by the grammar
        run: python scripts/verify_grammar.py test-code/wasm/*.mu test-code/x64/*.mu

      - name: Examples build for every target
        run: |
          mkdir out
          for f in test-code/wasm/*.mu; do
            for target in wasm wat; do
              ./build/mialuc.exe build --target $target -o out/x.$target "$f"
            done
          done
          for f in test-code/x64/*.mu; do
            ./build/mialuc.exe build --target x64-win32 -o out/x.exe "$f"
          done

      - name: Package
        run: |
          mkdir "mialuc-$GITHUB_REF_NAME"
          cp build/mialuc.exe LICENSE README.md "mialuc-$GITHUB_REF_NAME/"
          7z a "mialuc-$GITHUB_REF_NAME-win-x64.zip" "mialuc-$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: mialuc-*-win-x64.zip
          if-no-files-found: error

  # Runs only when every step of `verify` has passed.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mialuc-*-win-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "mialuc $GITHUB_REF_NAME" \
            --generate-notes
