# Pushing a tag such as `v0.1.0` checks the tagged commit and, only if every check passes,
# publishes a GitHub release with the compiler for Windows on x64, and mialudoc, the server of the
# documentation and the playground, with the files that it shows, in the same zip file. The version in
# the file VERSION is the single source of truth, and the tag has to match it.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag has the form vMAJOR.MINOR.PATCH
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Tag '$GITHUB_REF_NAME' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag '$GITHUB_REF_NAME' is not reachable from main"
            exit 1
          }

      - name: Tag matches VERSION
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "VERSION says $version"
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "::error::Tag '$GITHUB_REF_NAME' does not match VERSION ($version)"
            exit 1
          }

      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Compiler reports the tagged version
        run: |
          out="$(./build/mialuc.exe --version | tr -d '\r')"
          echo "$out"
          [ "$out" = "mialuc ${GITHUB_REF_NAME#v}" ] || {
            echo "::error::'mialuc --version' printed '$out', expected 'mialuc ${GITHUB_REF_NAME#v}'"
            exit 1
          }

      - name: Examples are accepted by the grammar
        run: python scripts/verify_grammar.py test-code/wasm/*.mu test-code/x64/*.mu scripts/*.mu

      - name: Examples build for every target
        run: |
          mkdir out
          for f in test-code/wasm/*.mu; do
            for target in wasm wat; do
              ./build/mialuc.exe build --target $target -o out/x.$target "$f"
            done
          done
          for f in test-code/x64/*.mu scripts/*.mu; do
            ./build/mialuc.exe build --target x64-win32 -o out/x.exe "$f"
          done

      - name: Package
        run: |
          mkdir "mialuc-$GITHUB_REF_NAME"
          package="mialuc-$GITHUB_REF_NAME"
          cp build/mialuc.exe build/mialudoc.exe LICENSE README.md "$package/"
          # The standard library is source code that the compiler reads, as `lib` next to it.
          cp -r src/mialu-std "$package/lib"
          # mialudoc is run in the directory of the package, and finds in it the files that it shows,
          # in the places that they have in the project: the documents, the logo, the pages of the
          # playground and its examples, and the sources that the page of the internals is made from.
          mkdir -p "$package/media" "$package/tests" "$package/test-code" "$package/src"
          cp -r docs "$package/docs"
          cp media/mialu-logo.png "$package/media/"
          cp -r tests/wasm "$package/tests/wasm"
          cp -r test-code/wasm "$package/test-code/wasm"
          cp src/tokenizer.h src/ast.h "$package/src/"
          7z a "mialuc-$GITHUB_REF_NAME-win-x64.zip" "mialuc-$GITHUB_REF_NAME"

      - name: The package finds its standard library
        run: |
          # The directory of the project that the compiler was built from is moved away, so that
          # only the directory `lib` next to the compiler in the package can be where it is found.
          mv src/mialu-std src/mialu-std-moved
          "./mialuc-$GITHUB_REF_NAME/mialuc.exe" build --target x64-win32 -o out/imports.exe test-code/x64/imports.mu
          "./mialuc-$GITHUB_REF_NAME/mialuc.exe" build --target wasm -o out/imports.wasm test-code/wasm/imports.mu
          mv src/mialu-std-moved src/mialu-std

      - name: The package serves the documentation and the playground
        run: |
          # mialudoc is run from the directory of the package, with the project moved away from its
          # files, so that only the ones of the package can be what it shows and runs.
          cd "mialuc-$GITHUB_REF_NAME"
          ./mialudoc.exe 8080 &
          server=$!
          curl -sf --retry 10 --retry-delay 1 --retry-connrefused http://localhost:8080/ | grep -q "getting-started"
          curl -sf http://localhost:8080/getting-started | grep -q "<h1"
          curl -sf http://localhost:8080/logo.png -o /dev/null
          curl -sf http://localhost:8080/tools/playground | grep -q "Playground"
          curl -sf http://localhost:8080/api/internals | grep -q "TOKEN_KIND_"
          curl -sf --data-binary @../test-code/wasm/sum.mu http://localhost:8080/compile | grep -q '"error":null'
          kill $server

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: mialuc-*-win-x64.zip
          if-no-files-found: error

  # Runs only when every step of `verify` has passed.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mialuc-*-win-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "mialuc $GITHUB_REF_NAME" \
            --generate-notes
